name: go-check

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Capture first so a gofmt failure is not hidden by an empty stdout.
      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet (e2e tag)
        run: go vet -tags=e2e ./...

      - name: go test -race
        run: go test -race ./...

      - name: make lint
        run: make lint

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-e2e
        run: make test-e2e

      # make test-e2e selects only TestEndToEndScenarios, so run the parser
      # regression explicitly.
      - name: Published port parser regression
        run: go test -count=1 -tags=e2e ./test -run '^TestPublishedPort$' -v
